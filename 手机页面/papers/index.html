.v10-affix-kind{font-size:10px;color:var(--en-muted)}.v10-affix-tag{font-size:10px;background:var(--en-coral-soft);color:#a7442e;border-radius:6px;padding:2px 6px}
.v10-affix-row .v10-affix-meaning{font-size:12px;margin:5px 0;color:var(--en-ink)}

cute","rule"],"tip":"use、cute 常有 /j/；rule 的 u_e 常读 /uː/，要逐词听。"},{"id":"10","title":"ai 与 ay","pattern":"ai / ay","sound":"eɪ","words":["rain","train","day","play"],"tip":"ai 常在词中，ay 常在词尾。这是常见规律，不是绝对规则。"},{"id":"11","title":"ee 与 ea","pattern":"ee / ea","sound":"iː","words":["see","green","tea","read"],"tip":"ea 也有其他读音，例如 bread；不能只凭组合猜所有单词。"},{"id":"12","title":"igh 组合","pattern":"igh","sound":"aɪ","words":["night","light","right"],"tip":"igh 在这些单词中共同表示 /aɪ/。"},{"id":"13","title":"oa 与 ow","pattern":"oa / ow","sound":"əʊ","words":["boat","coat","snow","show"],"tip":"ow 也可能读 /aʊ/，例如 cow；要结合整词确认。"},{"id":"14","title":"oo 的长音","pattern":"oo","sound":"uː","words":["moon","food","school"],"tip":"拉长元音。将 moon 与 book 分组对比。"},{"id":"15","title":"oo 的短音","pattern":"oo","sound":"ʊ","words":["book","look","good"],"tip":"短促放松；food 和 good 的 oo 读音不同。"},{"id":"16","title":"ar 组合","pattern":"ar","sound":"ɑː","words":["car","park","start"],"tip":"英式发音里这里通常不卷舌；美式常带 r 音。"},{"id":"17","title":"or 组合","pattern":"or","sound":"ɔː","words":["fork","short","sport"],"tip":"先读整词再观察 or；word 等单词不套用这一读法。"},{"id":"18","title":"er、ir 与 ur","pattern":"er / ir / ur","sound":"ɜː","words":["her","bird","turn"],"tip":"常见重读音节中可有相同元音，美式通常带卷舌。"},{"id":"19","title":"oi 与 oy","pattern":"oi / oy","sound":"ɔɪ","words":["coin","join","boy","toy"],"tip":"从 /ɔ/ 滑向 /ɪ/，保持一个连续的双元音。"},{"id":"20","title":"ou 与 ow","pattern":"ou / ow","sound":"aʊ","words":["out","cloud","cow","now"],"tip":"ou 还有其他读音，如 soup、young，需要逐词确认。"},{"id":"21","title":"sh 组合","pattern":"sh","sound":"ʃ","words":["ship","shop","fish"],"tip":"双唇略向前，送气摩擦；不要额外加“衣”音。"},{"id":"22","title":"ch 组合","pattern":"ch","sound":"tʃ","words":["chair","child","teach"],"tip":"先阻住气流再放开；school 中的 ch 不属于这一读法。"},{"id":"23","title":"清辅音 th","pattern":"th","sound":"θ","words":["think","thank","three"],"tip":"舌尖轻触上下齿之间，送气，声带不振动。"},{"id":"24","title":"浊辅音 th","pattern":"th","sound":"ð","words":["this","that","mother"],"tip":"口型接近 /θ/，但声带振动。"},{"id":"25","title":"ph 组合","pattern":"ph","sound":"f","words":["phone","photo","phrase"],"tip":"上齿轻触下唇，送气摩擦；这里 ph 共同表示 /f/。"},{"id":"26","title":"ng 组合","pattern":"ng","sound":"ŋ","words":["sing","long","king"],"tip":"舌后部抬起，鼻腔出声；这些例词末尾不额外加 /ɡ/。"},{"id":"27","title":"ck 组合","pattern":"ck","sound":"k","words":["back","neck","duck"],"tip":"两个字母在这些词中共同表示一个 /k/ 音。"},{"id":"28","title":"tion 结尾","pattern":"tion","sound":"ʃən","words":["nation","action","station"],"tip":"这里练习常见结尾的声音；词缀含义要与32天词根课分开理解。"}],"grammarTopics":[{"id":"g1","title":"主谓一致","question":"The number of students ___ increasing.","options":["is","are","be","were"],"answer":0,"explain":"the number of ... 表示“……的数量”，主语中心词是单数 number，谓语用 is。"},{"id":"g2","title":"一般过去时","question":"She ___ the museum yesterday.","options":["visits","visited","has visited","is visiting"],"answer":1,"explain":"yesterday 指过去具体时间，常用一般过去时 visited。"},{"id":"g3","title":"被动语态","question":"The room ___ every day.","options":["cleans","cleaning","is cleaned","has cleaned"],"answer":2,"explain":"房间被打扫，every day 表示习惯，使用一般现在时被动语态 is cleaned。"},{"id":"g4","title":"定语从句","question":"The book ___ I bought is useful.","options":["who","whom","which","where"],"answer":2,"explain":"先行词是 book，关系词在从句中作 bought 的宾语，可以用 which 或 that，此题选 which。"},{"id":"g5","title":"非谓语动词","question":"I look forward to ___ from you.","options":["hear","hearing","heard","be heard"],"answer":1,"explain":"look forward to 中 to 是介词，后接名词或动名词，选 hearing。"},{"id":"g6","title":"条件与时间从句","question":"If it ___ tomorrow, we will stay at home.","options":["will rain","rained","rains","has rained"],"answer":2,"explain":"表示将来条件时，if 从句通常用一般现在时，主句用将来时。"},{"id":"g7","title":"比较结构","question":"This problem is ___ than that one.","options":["difficult","more difficult","most difficult","the difficult"],"answer":1,"explain":"than 常引出比较对象，多音节形容词 difficult 的比较级是 more difficult。"},{"id":"g8","title":"介词与固定搭配","question":"He is interested ___ learning English.","options":["on","at","in","for"],"answer":2,"explain":"be interested in 是固定搭配，in 后接名词或动名词。"}],"essays":[{"id":"invitation","title":"邀请信","tag":"书信写作","prompt":"邀请同学参加一次校园活动，交代活动、时间、地点和期待。请按实际试题要求调整字数。","text":"Dear [name],\nI am writing to invite you to [activity]. It will take place at [place] on [date].\nDuring the activity, we will [activity one] and [activity two]. It will be a good chance for us to [purpose]. Please let me know whether you can come.\nI look forward to your reply.\nYours,\n[name]","points":["开头说明邀请目的","正文交代时间、地点、活动","结尾请求回复，不遗漏题目要点"]},{"id":"advice","title":"建议信","tag":"书信写作","prompt":"针对朋友学习英语遇到的困难提出建议，并说明理由。","text":"Dear [name],\nI am glad to hear from you. Here are some suggestions about [problem].\nFirst, you can [suggestion one], because [reason one]. Besides, it is helpful to [suggestion two]. This will help you [benefit]. Finally, try to [suggestion three] and keep a record of your progress.\nI hope these suggestions will be useful to you.\nYours,\n[name]","points":["建议应具体、可执行","每条建议配一个简短理由","避免照搬与题目无关的句子"]},{"id":"opinion","title":"观点类短文","tag":"短文写作","prompt":"就一个校园或生活话题表达观点，并用两点理由说明。","text":"Nowadays, [topic] is often discussed. In my opinion, [your view].\nThere are two main reasons. First, [reason one]. For example, [example]. Second, [reason two]. It can help us [benefit]. Of course, we should also pay attention to [a limitation].\nTherefore, I believe that [restate your view]. What matters most is to [practical action].","points":["观点明确，理由与观点一致","例子服务于论点","替换方括号后检查语法与衔接"]},{"id":"experience","title":"经历与收获","tag":"记叙写作","prompt":"描述一次有意义的活动或经历，并说明自己的收获。","text":"Last [time], I took part in [activity] with [people]. It was an experience I will always remember.\nAt first, [situation]. Then, we [action one] and [action two]. Although [difficulty], we managed to [result] by [method]. I felt [feeling] when [detail].\nFrom this experience, I learned that [lesson]. In the future, I will [plan].","points":["过去的经历注意使用过去时","按时间顺序叙述","结尾写具体收获，避免空话"]}],"legacyPlanTasks":[{"id":"p1-1","title":"老秦 58 组母词课（53 节）：每晚 1 节"},{"id":"p1-2","title":"词根词缀手册：每周 4 组（周一/二/四/五）"},{"id":"p1-3","title":"听力磨耳朵：每晚 15 分钟"},{"id":"p2-1","title":"英语：500 词课（10 节）+ 母词二刷"},{"id":"p2-2","title":"高数一：教材开始过（函数/极限/连续）"},{"id":"p2-3","title":"信息技术：教材过第一遍"},{"id":"p2-4","title":"政治：先不碰"},{"id":"p3-1","title":"高数一：教材过完 + 每章做题"},{"id":"p3-2","title":"信息技术：第一遍过完，开始背知识点"},{"id":"p3-3","title":"英语：语法 20 考点课（47 节），每天 1-2 节"},{"id":"p4-1","title":"高数一：3h — 刷题 + 错题本"},{"id":"p4-2","title":"信息技术：2h — 章节题 + 背诵"},{"id":"p4-3","title":"英语：2h — 阅读技巧课（14 节）+ 20 篇阅读"},{"id":"p4-4","title":"政治：1h — 马原看课理解，不背"},{"id":"p5-1","title":"高数一：工作日晚上刷题，周末做套卷"},{"id":"p5-2","title":"信息技术：晚上看知识点，周末刷题"},{"id":"p5-3","title":"英语：阅读刷题课（20 节）+ 完形课（10 节）周末看"},{"id":"p5-4","title":"政治：肖秀荣 1000 题刷起来"},{"id":"p6-1","title":"高数一：真题每周 1 套，错题三刷"},{"id":"p6-2","title":"信息技术：背诵版反复背 + 真题"},{"id":"p6-3","title":"政治：肖四肖八 + 主观题背诵"},{"id":"p6-4","title":"英语：写作 3 套模板背熟 + 每天 2 篇阅读保持手感"},{"id":"p7-1","title":"考前 3 天：每天上午 9 点按考试时间刷 1 套完整真题，下午批改"},{"id":"p7-2","title":"每天写 1 篇英语作文（用模板，掐 20 分钟）"},{"id":"p7-3","title":"政治：肖四大题滚瓜烂熟"},{"id":"p7-4","title":"错题本翻一遍，不做新题"}],"originalPlanText":"河北专升本理工3 · 备考打卡\n河北专升本 · 理工3 类\n英语100 + 政治100 + 高数一150 + 信息技术150 = 500分\n--\n天\n距 2028 年河北专升本考试（预计 4 月中旬）\n寒假在家\n2027.1.11\n· 暑假启动\n2027.7.1\n· 全力冲刺\n2027.12.15\n总打卡进度\n0%\n阶段任务\n32组词根词缀\n① 在校轻量期\n2026.10.10 — 2027.1.10 · 约 3 个月\n当前\n上课期间，每晚 30 分钟，只学英语。不做题、不焦虑。\n老秦 58 组母词课（53 节）：每晚 1 节\n词根词缀手册：每周 4 组（周一/二/四/五）\n听力磨耳朵：每晚 15 分钟\n② 寒假在家期\n2027.1.11 — 2027.2.28 · 约 7 周\n在家\n在家可以上强度，每天 4-5 小时。英语接 500 词课，数学和信息技术开始入门。\n英语：500 词课（10 节）+ 母词二刷\n高数一：教材开始过（函数/极限/连续）\n信息技术：教材过第一遍\n政治：先不碰\n③ 大二下在校期\n2027.3.1 — 2027.6.30 · 约 18 周\n在校\n上课期间每天晚上 1.5-2 小时，周末多学。继续数学和信息技术，英语开始语法课。\n高数一：教材过完 + 每章做题\n信息技术：第一遍过完，开始背知识点\n英语：语法 20 考点课（47 节），每天 1-2 节\n④ 暑假正式启动\n2027.7.1 — 2027.8.31 · 约 9 周\n在家 8h/天\n四科全开，每天 8 小时。这是最关键的一段。\n高数一：3h — 刷题 + 错题本\n信息技术：2h — 章节题 + 背诵\n英语：2h — 阅读技巧课（14 节）+ 20 篇阅读\n政治：1h — 马原看课理解，不背\n⑤ 实习边工边读\n2027.9.1 — 2027.12.15 · 约 15 周\n实习\n工作日晚上 3.5h，周末 8h。英语压缩到最低，专业课和政治为主。\n高数一：工作日晚上刷题，周末做套卷\n信息技术：晚上看知识点，周末刷题\n英语：阅读刷题课（20 节）+ 完形课（10 节）周末看\n政治：肖秀荣 1000 题刷起来\n⑥ 全力冲刺\n2027.12.15 — 2028.3.31 · 约 15 周\n在家 8h/天\n不再实习，全天在家。上强度、真题为主。\n高数一：真题每周 1 套，错题三刷\n信息技术：背诵版反复背 + 真题\n政治：肖四肖八 + 主观题背诵\n英语：写作 3 套模板背熟 + 每天 2 篇阅读保持手感\n⑦ 考前急救\n2028.4.1 — 2028.4.14 · 2 周\n考前\n不熬夜，不焦虑。政治和专业课背诵为主，英语只看模板。\n考前 3 天：每天上午 9 点按考试时间刷 1 套完整真题，下午批改\n每天写 1 篇英语作文（用模板，掐 20 分钟）\n政治：肖四大题滚瓜烂熟\n错题本翻一遍，不做新题\n清空打卡记录","motherAffixes":{"definitions":{"in-":{"kind":"前缀","meaning":"向内；也可表示否定，须结合具体单词","day":1},"im-":{"kind":"前缀","meaning":"in- 的常见变体：向内；也可表示否定","day":1},"ex-":{"kind":"前缀","meaning":"向外；离开","day":2},"re-":{"kind":"前缀","meaning":"再；回；重新","day":3},"pre-":{"kind":"前缀","meaning":"在前；预先","day":4},"pro-":{"kind":"前缀","meaning":"向前；促进","day":5},"sub-":{"kind":"前缀","meaning":"在下；次于","day":6},"dis-":{"kind":"前缀","meaning":"分开；否定；相反","day":8},"com-":{"kind":"前缀","meaning":"共同；一起","day":9},"con-":{"kind":"前缀","meaning":"共同；一起","day":9},"trans-":{"kind":"前缀","meaning":"跨越；转移","day":10},"over-":{"kind":"前缀","meaning":"过度；在上","day":12},"under-":{"kind":"前缀","meaning":"在下；不足；低于","day":13},"un-":{"kind":"前缀","meaning":"不；也可表示逆转","day":15},"inter-":{"kind":"前缀","meaning":"在……之间；相互","day":null},"de-":{"kind":"前缀","meaning":"离开；向下；去除，依具体单词而定","day":null},"post-":{"kind":"前缀","meaning":"在……之后","day":null},"en-":{"kind":"前缀","meaning":"使成为；使进入某种状态","day":null},"non-":{"kind":"前缀","meaning":"不；非","day":null},"uni-":{"kind":"前缀","meaning":"一个；单一","day":null},"multi-":{"kind":"前缀","meaning":"多个；多种","day":null},"tele-":{"kind":"前缀","meaning":"远；远距离","day":null},"super-":{"kind":"前缀","meaning":"在上；超过","day":null},"semi-":{"kind":"前缀","meaning":"半；部分","day":null},"counter-":{"kind":"前缀","meaning":"相反；对应","day":null},"up-":{"kind":"前缀","meaning":"向上；提升","day":null},"e-":{"kind":"前缀","meaning":"向外，部分拉丁来源词中的形式","day":null},"ad-":{"kind":"前缀","meaning":"向；朝向","day":null},"at-":{"kind":"前缀","meaning":"ad- 在 t 前的同化形式：朝向","day":null},"as-":{"kind":"前缀","meaning":"ad- 在 s 前的同化形式：朝向","day":null},"ap-":{"   for(const entry of w.entries||[w.entry])if(entry&& !u.entries.includes(String(entry)))u.entries.push(String(entry));
  for(const source of w.sources||[w.from])if(source&& !u.sources.includes(source))u.sources.push(source);
  for(const meaning of w.meanings||[w.mean])if(meaning&& !u.meanings.includes(meaning))u.meanings.push(meaning);

}

function coreReading(w){

 return (w.no==='2'?'<aside class="v9-core-source-note">教材核对提醒：本条标题为 experience，例句涉及 following；请结合原教材核对。</aside>':'')+w.blocks.map((b,i)=>{

async function compressNotePhoto(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('请选择 JPG、PNG 或 WebP 图片，其他格式请先转换。');
 if(file.size>12*1024*1024||!file.size)throw new Error('每张原图需在 12 MB 以内，且不能为空。');
 const url=URL.createObjectURL(file),img=new Image();try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('图片无法解码，请换一张 JPG 或 PNG 照片。'));img.src=url});
 const scale=Math.min(1,2200/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
 let blob;for(const quality of [.86,.74,.6]){blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));if(blob&&blob.size<=3*1024*1024)return blob}throw new Error('压缩后仍超过 3 MB，请裁剪照片后重试。');
 }finally{URL.revokeObjectURL(url)}
}

   if(active.length>=PHOTO_MAX)throw new Error('本课已达 '+PHOTO_MAX+' 张上限，请移除后再上传。');

document.addEventListener('change',e=>{const el=e.target;if(el.dataset.chapterScope!==undefined){const values=new Set(chapterSelection);el.checked?values.add(el.dataset.chapterScope):values.delete(el.dataset.chapterScope);changeSpellScopes([...values]);return}if(el.id==='unitFilter'){filter=el.value;limit=60;render()}if(el.id==='reviewFilter'){filter=el.value;render()}if(el.dataset.taskKey){const k=el.dataset.taskKey,value=el.checked;write(()=>rpc('study_save',{p_module:'plan',p_key:k,p_data:{done:value}}),'计划清单已保存。')}});
